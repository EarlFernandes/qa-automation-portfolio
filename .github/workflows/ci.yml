name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
        env:
          CI: 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright/playwright-report
            playwright/results
          retention-days: 14

  selenium:
    name: Selenium (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: selenium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: selenium/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # Chrome is preinstalled on ubuntu-latest. Selenium Manager resolves the driver.
        run: python -m pytest
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium/results
          retention-days: 14

  api-tests:
    name: API contract tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-tests/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: api-tests/results
          retention-days: 14

  llm-evals:
    name: LLM evals and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: llm-evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Restore gate history
        # The promotion policy needs the last runs. The cache key changes every
        # run, so the newest history is saved and the latest previous one restored.
        uses: actions/cache@v4
        with:
          path: llm-evals/reports/gate_history.json
          key: gate-history-${{ github.run_id }}
          restore-keys: gate-history-
      - name: Run evals (offline regex extractor)
        run: llm-evals run --dataset data/golden.jsonl --extractor regex --out reports/
      - name: Release gate
        run: llm-evals gate --results reports/results.json --config gate.yaml --history reports/gate_history.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-evals-report
          path: |
            llm-evals/reports/report.html
            llm-evals/reports/results.json
            llm-evals/reports/junit.xml
          retention-days: 14
