name: Docker

# Builds the Playwright image and runs the smoke tests inside it, so the
# suite is proven to run on a clean machine with nothing installed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "playwright/Dockerfile"
      - "playwright/.dockerignore"
      - "playwright/package.json"
      - "playwright/package-lock.json"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t qa-portfolio-playwright ./playwright
      - name: Run the smoke tests inside the container
        run: docker run --rm -e CI=1 qa-portfolio-playwright
