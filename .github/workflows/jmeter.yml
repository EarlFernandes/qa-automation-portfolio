name: JMeter load test

# Manual only. The target is a public demo API, so the load stays small.
on:
  workflow_dispatch:
    inputs:
      threads:
        description: Concurrent users
        default: "5"
        required: true
      loops:
        description: Loops per user
        default: "4"
        required: true
      sla_ms:
        description: Duration assertion per request, in milliseconds
        default: "2000"
        required: true

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jmeter
    env:
      JMETER_VERSION: 5.6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Apache JMeter
        run: |
          curl -sSL -o /tmp/jmeter.tgz "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf /tmp/jmeter.tgz -C /tmp
          echo "JMETER_HOME=/tmp/apache-jmeter-${JMETER_VERSION}" >> "$GITHUB_ENV"
      - name: Run the plan
        run: ./run.sh
        env:
          THREADS: ${{ inputs.threads }}
          LOOPS: ${{ inputs.loops }}
          SLA_MS: ${{ inputs.sla_ms }}
      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-dashboard
          path: jmeter/results
          retention-days: 14
